<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radar</title>
<!-- v3-L.2 (docs/spec/ai-pulse-v3l2.md), reworked in v3-L.6 (docs/spec/ai-pulse-v3l6.md).
     Rendered by scripts/radar_live.py in headless Chromium: __load(segment) once per segment,
     then one screenshot per __seek(t). API and model text is only ever set with textContent,
     never parsed as markup, and the page loads no script and no network URL; fonts come from
     assets/fonts. Text is fitted by MEASURING it (CLAUDE.md: never size text by character
     count). Palette and fonts are the storyboard's (assets/storyboard/storyboard.html). -->
<style>
@font-face { font-family: "Inter"; font-weight: 900; src: url("../fonts/Inter-Black.ttf"); }
@font-face { font-family: "JetBrains Mono"; src: url("../fonts/JetBrainsMono-Regular.ttf"); }
:root {
  --bg: #090D18; --text: #F4F7FF; --subt: #96AACD; --cyan: #22D3EE; --blue: #3B82F6;
  --violet: #8B5CF6; --yellow: #FFD60A; --card-top: #0D1426; --card-bot: #182E5C;
}
html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: var(--bg);
  overflow: hidden; }
body { font-family: "Inter", "Segoe UI", "Microsoft YaHei", "Yu Gothic", sans-serif;
  font-weight: 900; color: var(--text); }
.mono { font-family: "JetBrains Mono", "Consolas", monospace; font-weight: 400; }
#top { position: absolute; left: 80px; top: 36px; width: 1760px; height: 64px; }
#brand { position: absolute; left: 0; top: 0; height: 64px; line-height: 64px;
  font-size: 40px; letter-spacing: 2px; white-space: nowrap; }
#brand span { color: var(--cyan); }
/* L6 row 6 / row 8: the centre of the top bar holds NEXT, or the subscribe line for 5 s */
#mid { position: absolute; left: 420px; top: 4px; width: 900px; height: 56px;
  display: flex; align-items: center; justify-content: center; }
#next { font-size: 28px; color: var(--subt); white-space: nowrap; overflow: hidden; }
#next b { color: var(--cyan); font-weight: 900; }
#cta { display: none; max-width: 900px; height: 56px; line-height: 56px; padding: 0 26px;
  border-radius: 999px; background: var(--yellow); color: var(--bg); font-size: 28px;
  white-space: nowrap; overflow: hidden; }
#asof { position: absolute; right: 0; top: 0; height: 64px; line-height: 64px;
  font-size: 24px; color: var(--subt); white-space: nowrap; }
#asof.stale { color: var(--yellow); }
#card { position: absolute; left: 80px; top: 130px; width: 1100px; height: 720px;
  box-sizing: border-box; padding: 40px 48px; border-radius: 16px;
  background: linear-gradient(var(--card-top), var(--card-bot));
  display: flex; flex-direction: column; gap: 20px; }
#chips { display: flex; gap: 16px; height: 52px; flex-shrink: 0; }
.chip { font-size: 24px; line-height: 52px; padding: 0 20px; border-radius: 999px;
  background: var(--bg); color: var(--cyan); white-space: nowrap; }
.chip.status { color: var(--yellow); }
#name { height: 120px; flex-shrink: 0; font-size: 104px; line-height: 1.1; overflow: hidden;
  overflow-wrap: anywhere; }
#owner { height: 40px; flex-shrink: 0; font-size: 30px; color: var(--subt); white-space: nowrap;
  overflow: hidden; }
#use { height: 56px; flex-shrink: 0; font-size: 40px; line-height: 56px; color: var(--yellow);
  white-space: nowrap; overflow: hidden; }
#desc { height: 150px; flex-shrink: 0; font-size: 40px; line-height: 1.3; overflow: hidden;
  overflow-wrap: anywhere; }
#facts { display: flex; flex-wrap: wrap; gap: 14px 18px; height: 120px; overflow: hidden;
  align-content: flex-start; flex-shrink: 0; }
.fact { font-size: 26px; line-height: 50px; padding: 0 20px; border-radius: 12px;
  background: rgba(9, 13, 24, 0.55); color: var(--text); white-space: nowrap; }
#side { position: absolute; left: 1240px; top: 130px; width: 600px; height: 720px;
  overflow: hidden; box-sizing: border-box; padding: 28px 28px; border-radius: 16px;
  background: var(--card-top); }
.sec h2 { margin: 0; font-size: 28px; color: var(--cyan); letter-spacing: 2px; }
.sec .by { font-size: 19px; color: var(--subt); margin: 2px 0 8px 0; }
.sec + .sec { margin-top: 22px; }
.row { display: flex; align-items: center; gap: 14px; height: 60px; border-radius: 12px;
  padding: 0 12px; }
.row.hl { background: var(--card-bot); }
.row .rk { width: 44px; font-size: 26px; color: var(--subt); }
.row .nm { flex: 1; min-width: 0; font-size: 28px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.row .num { font-size: 22px; color: var(--yellow); white-space: nowrap; }
.row .gain { font-size: 20px; color: var(--cyan); white-space: nowrap; }
#bigboard { display: none; position: absolute; left: 80px; top: 130px; width: 1760px;
  height: 720px; box-sizing: border-box; padding: 40px 48px; border-radius: 16px;
  background: linear-gradient(var(--card-top), var(--card-bot)); }
#bigboard h1 { margin: 0 0 18px 0; font-size: 60px; }
#bigboard h1 span { color: var(--cyan); }
#bigcols { display: flex; gap: 48px; }
#bigcols .sec { flex: 1; min-width: 0; margin: 0; }
#bigcols .sec h2 { font-size: 34px; }
#bigcols .sec .by { font-size: 22px; }
#bigcols .row { height: 62px; }
#bigcols .row .nm { font-size: 32px; }
#end { display: none; position: absolute; left: 80px; top: 130px; width: 1760px;
  height: 720px; box-sizing: border-box; padding: 80px; border-radius: 16px;
  background: linear-gradient(var(--card-top), var(--card-bot)); text-align: center; }
#end h1 { margin: 40px 0 36px 0; font-size: 96px; }
#end h1 span { color: var(--cyan); }
#end .why { font-size: 44px; margin-bottom: 24px; }
#end .count { font-size: 40px; color: var(--yellow); margin-bottom: 24px; }
#end .back { font-size: 36px; color: var(--subt); margin-bottom: 40px; }
#end .sub { display: inline-block; font-size: 36px; padding: 14px 32px; border-radius: 999px;
  background: var(--yellow); color: var(--bg); }
#cap { position: absolute; left: 80px; top: 880px; width: 1760px; height: 110px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 50px; line-height: 1.1; overflow: hidden; }
#bar { position: absolute; left: 80px; top: 862px; height: 6px; width: 0;
  background: var(--cyan); border-radius: 999px; }
#foot { position: absolute; left: 80px; top: 1012px; width: 1760px; height: 40px;
  font-size: 22px; color: var(--subt); text-align: center; }
</style>
</head>
<body>
<div id="top"><div id="brand">TOOLDOJO <span>RADAR</span></div>
  <div id="mid"><div id="next" class="mono"></div><div id="cta"></div></div>
  <div id="asof" class="mono"></div></div>
<div id="card">
  <div id="chips"></div>
  <div id="name"></div>
  <div id="owner" class="mono"></div>
  <div id="use"></div>
  <div id="desc"></div>
  <div id="facts"></div>
</div>
<div id="bigboard"><h1>THE <span>BOARD</span></h1><div id="bigcols"></div></div>
<div id="end"><h1>THAT'S TODAY'S <span>RADAR</span></h1>
  <div class="why"></div><div class="count mono"></div><div class="back"></div>
  <div class="sub"></div></div>
<div id="side"></div>
<div id="bar"></div>
<div id="cap"></div>
<div id="foot" class="mono">Automated stream · AI voice · data from the GitHub and Hugging Face public APIs</div>
<script>
(function () {
  "use strict";
  var seg = null;
  var CAP_HOLD = 0.6;   // a phrase stays up this long after its last word, unless the next starts
  // L6 row 3: each source is ranked by its own measure, so each section says which
  var SECTIONS = [["github", "GITHUB", "ranked by stars per day since created"],
                  ["hf", "HUGGING FACE", "ranked by HF trending score"]];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = String(text);
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function over(e) { return e.scrollHeight > e.clientHeight + 1 || e.scrollWidth > e.clientWidth + 1; }
  // Shrink until it fits; report what still does not fit at the floor.
  function fit(e, max, min) {
    var s = max;
    e.style.fontSize = s + "px";
    while (over(e) && s > min) { s -= 2; e.style.fontSize = s + "px"; }
    return !over(e);
  }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }

  function rows(target, list, hl) {
    (list || []).forEach(function (r) {
      var row = el("div", "row" + (r.id === hl ? " hl" : ""));
      row.appendChild(el("div", "rk mono", "#" + r.rank));
      row.appendChild(el("div", "nm", r.name));
      row.appendChild(el("div", "num mono", r.measure || (fmt(r.number) + (r.unit === "stars" ? " ★" : " ♥"))));
      if (r.gain > 0) row.appendChild(el("div", "gain mono", "+" + fmt(r.gain) + (r.unit === "stars" ? "★" : "♥")));
      target.appendChild(row);
    });
  }
  function sections(target, secs, hl) {
    clear(target);
    SECTIONS.forEach(function (s) {
      var list = (secs || {})[s[0]] || [];
      if (!list.length) return;
      var box = el("div", "sec");
      box.appendChild(el("h2", "", s[1]));
      box.appendChild(el("div", "by mono", s[2]));
      rows(box, list, hl);
      target.appendChild(box);
    });
  }

  window.__facts = function () {     // what is on the card after fitting (tests, frames)
    return Array.prototype.map.call($("facts").children, function (c) { return c.textContent; });
  };

  window.__load = function (s) {
    seg = s;
    var unfit = [];
    var asof = $("asof");
    asof.textContent = s.as_of ? (s.stale ? "SOURCE DELAYED · data as of " : "data as of ") + s.as_of : "";
    asof.className = "mono" + (s.stale ? " stale" : "");
    var nx = $("next");
    clear(nx);
    if (s.next) { nx.appendChild(document.createTextNode("NEXT ▸ ")); nx.appendChild(el("b", "", s.next)); }
    $("cta").textContent = s.cta_text || "";
    var card = $("card"), big = $("bigboard"), side = $("side"), end = $("end");
    card.style.display = "none"; big.style.display = "none"; side.style.display = "none";
    end.style.display = "none";
    if (s.type === "spotlight") {
      card.style.display = "flex"; side.style.display = "block";
      var t = s.tool, chips = $("chips");
      clear(chips);
      chips.appendChild(el("div", "chip status mono", s.status || ""));
      chips.appendChild(el("div", "chip mono", s.rank_label));
      $("name").textContent = t.name;
      $("owner").textContent = t.url_text;
      var use = $("use");
      use.textContent = t.use_it_for ? "USE IT TO: " + t.use_it_for.toUpperCase() : "";
      use.style.display = t.use_it_for ? "block" : "none";
      $("desc").style.height = t.use_it_for ? "150px" : "226px";
      $("desc").textContent = t.desc;
      var facts = $("facts");
      clear(facts);
      (s.facts || []).forEach(function (f) { facts.appendChild(el("div", "fact mono", f)); });
      if (!fit($("name"), 104, 52)) unfit.push("name");
      if (t.use_it_for && !fit(use, 40, 24)) unfit.push("use");
      if (!fit($("desc"), 40, 26)) unfit.push("desc");
      if (!fit($("owner"), 30, 20)) unfit.push("owner");
      // v3l3 row 2: drop the LAST fact chip while the row overflows; the first one
      // (the headline number) always stays
      while (over(facts) && facts.children.length > 1) facts.removeChild(facts.lastChild);
      if (over(facts)) unfit.push("facts");
      sections(side, s.sections, s.highlight);
    } else if (s.type === "end") {
      end.style.display = "block";
      end.querySelector(".why").textContent = s.end_reason === "exhausted"
        ? "Every fresh tool on the radar has been covered." : "That's the end of today's session.";
      end.querySelector(".count").textContent = fmt(s.end_count) + " tools covered today";
      end.querySelector(".back").textContent = s.end_daily
        ? "ToolDojo Radar is back every day at " + s.end_daily + " IST" : "";
      end.querySelector(".sub").textContent = "Subscribe to ToolDojo for practical AI tools";
    } else {
      big.style.display = "block";
      sections($("bigcols"), s.sections, null);
    }
    window.__seek(0);
    return unfit;
  };

  window.__seek = function (t) {
    if (!seg) return;
    var cap = $("cap"), text = "";
    var ph = seg.phrases || [];
    for (var i = 0; i < ph.length; i++) {
      var nextStart = i + 1 < ph.length ? ph[i + 1][0] : Infinity;
      if (t >= ph[i][0] && t < Math.min(nextStart, ph[i][1] + CAP_HOLD)) { text = ph[i][2]; break; }
    }
    cap.textContent = text;
    if (text) fit(cap, 50, 30);
    // L6 row 8: the subscribe line takes NEXT's place for its window, never the captions'
    var on = !!(seg.cta && t >= seg.cta[0] && t < seg.cta[1]);
    $("cta").style.display = on ? "block" : "none";
    $("next").style.display = on ? "none" : "block";
    if (on) fit($("cta"), 28, 18);
    var w = seg.length > 0 ? Math.min(1, t / seg.length) : 0;
    $("bar").style.width = Math.round(1760 * w) + "px";
  };

  window.__ready = true;
})();
</script>
</body>
</html>
